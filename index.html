<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>催眠APP</title>
    <style>
        /* ===========================================
           HYPNO GLASS DESIGN TOKENS
           Synced with Figma: Hypno App — Modern Glass UI
           =========================================== */
        :root {
            --bg-canvas: #05050a;
            --surface-glass: rgba(20, 20, 36, 0.62);
            --surface-glass-hover: rgba(30, 30, 52, 0.78);
            --surface-glass-elevated: rgba(20, 20, 36, 0.84);
            --surface-glass-subtle: rgba(255, 255, 255, 0.07);
            --border-glass: rgba(255, 255, 255, 0.14);
            --border-glass-strong: rgba(255, 255, 255, 0.24);
            --border-accent: rgba(166, 140, 250, 0.48);

            --accent-primary: #7c5cff;
            --accent-secondary: #c084fc;
            --accent-climax: #f472b6;

            --text-primary: #f8fafc;
            --text-secondary: #a3b0c7;
            --text-muted: #738099;

            --danger-base: #fb7185;
            --danger-bg: rgba(251, 113, 133, 0.12);
            --danger-border: rgba(251, 113, 133, 0.35);

            --radius-pill: 999px;
            --radius-drawer: 28px;
            --radius-control: 12px;

            --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'PingFang SC', 'Hiragino Sans', 'Microsoft YaHei', sans-serif;
            --font-mono: 'JetBrains Mono', 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace;
        }

        /* ===========================================
           BASE & FULL-BLEED CANVAS
           =========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-canvas);
            color: var(--text-primary);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        button:focus-visible {
            box-shadow: 0 0 0 2px var(--bg-canvas), 0 0 0 4px var(--accent-primary);
        }

        .app-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: var(--bg-canvas);
            overflow: hidden;
        }

        /* Shader Container */
        #container {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        #glCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===========================================
           IDLE AMBIENT STAGE (Visible when not active)
           =========================================== */
        .idle-ambient {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.6s var(--ease-spring), transform 0.6s var(--ease-spring);
        }

        .app-shell.is-active .idle-ambient {
            opacity: 0;
            transform: scale(1.06);
        }

        .idle-nebula {
            position: absolute;
            width: min(82vw, 560px);
            height: min(82vw, 560px);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(168, 85, 247, 0.22) 0%,
                rgba(124, 92, 255, 0.11) 38%,
                rgba(56, 22, 130, 0.04) 68%,
                transparent 100%
            );
            filter: blur(8px);
            animation: idleBreath 5.5s ease-in-out infinite;
        }

        .idle-rings {
            position: absolute;
            width: min(92vw, 620px);
            height: min(92vw, 620px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .idle-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(192, 132, 252, 0.11);
        }

        .idle-ring:nth-child(1) { width: 22%; height: 22%; border-color: rgba(192, 132, 252, 0.22); }
        .idle-ring:nth-child(2) { width: 42%; height: 42%; border-color: rgba(192, 132, 252, 0.16); }
        .idle-ring:nth-child(3) { width: 64%; height: 64%; border-color: rgba(192, 132, 252, 0.11); }
        .idle-ring:nth-child(4) { width: 88%; height: 88%; border-color: rgba(192, 132, 252, 0.07); }

        .idle-cue {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .idle-cue-title {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.14em;
            color: var(--text-secondary);
        }

        .idle-cue-sub {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        @keyframes idleBreath {
            0%, 100% { transform: scale(0.96); opacity: 0.85; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* ===========================================
           TOP FLOATING GLASS PILL
           =========================================== */
        .top-pill {
            position: fixed;
            top: max(22px, env(safe-area-inset-top, 22px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: var(--radius-pill);
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: opacity 0.45s var(--ease-spring), transform 0.45s var(--ease-spring), border-color 0.3s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.35s ease, box-shadow 0.35s ease;
            flex-shrink: 0;
        }

        .app-shell.is-active .status-dot {
            background: var(--accent-climax);
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.9);
            animation: dotPulse 1.8s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.85); }
        }

        .app-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .pill-divider {
            width: 1px;
            height: 12px;
            background: rgba(255, 255, 255, 0.18);
        }

        .status-text {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        .app-shell.is-active .status-text {
            color: var(--accent-secondary);
        }

        /* ===========================================
           BOTTOM FLOATING GLASS DOCK & CLIMAX PILL
           =========================================== */
        .bottom-controls {
            position: fixed;
            bottom: max(26px, env(safe-area-inset-bottom, 26px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            transition: transform 0.45s var(--ease-spring);
        }

        /* Climax Pulse Pill */
        .climax-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 42px;
            padding: 0 22px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255, 217, 237, 0.38);
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.8) 0%, rgba(147, 51, 234, 0.8) 100%);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            box-shadow: 0 8px 26px rgba(244, 114, 182, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            opacity: 0;
            transform: translateY(14px) scale(0.92);
            pointer-events: none;
            transition: opacity 0.35s var(--ease-spring), transform 0.35s var(--ease-bounce), box-shadow 0.3s ease;
        }

        .climax-btn.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .climax-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 12px 34px rgba(244, 114, 182, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .climax-btn:active {
            transform: translateY(0) scale(0.96);
        }

        .climax-btn.pulsing {
            animation: climaxPulse 0.58s var(--ease-bounce);
        }

        @keyframes climaxPulse {
            0% { transform: scale(1); box-shadow: 0 8px 26px rgba(244, 114, 182, 0.45); }
            45% { transform: scale(1.14); box-shadow: 0 16px 48px rgba(244, 114, 182, 0.88), 0 0 36px rgba(192, 132, 252, 0.7); }
            100% { transform: scale(1); box-shadow: 0 8px 26px rgba(244, 114, 182, 0.45); }
        }

        /* Main Dock Row */
        .dock-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        /* Circular Glass Icon Buttons (Settings & Language) */
        .glass-circle-btn {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-glass);
            background: var(--surface-glass);
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: opacity 0.4s var(--ease-spring), transform 0.3s var(--ease-bounce), background 0.25s ease, border-color 0.25s ease;
        }

        .glass-circle-btn:hover {
            background: var(--surface-glass-hover);
            border-color: var(--border-glass-strong);
            transform: translateY(-2px) scale(1.06);
        }

        .glass-circle-btn:active {
            transform: scale(0.94);
        }

        .glass-circle-btn .gear-icon {
            width: 20px;
            height: 20px;
            transition: transform 0.4s var(--ease-bounce);
        }

        .glass-circle-btn:hover .gear-icon {
            transform: rotate(35deg);
        }

        .app-shell.settings-open .settings-btn {
            border-color: var(--border-accent);
            background: rgba(124, 92, 255, 0.22);
        }

        .lang-quick-btn {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        /* Primary Hypnosis Pill */
        .hypnosis-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            min-width: 156px;
            padding: 0 26px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, rgba(124, 92, 255, 0.94) 0%, rgba(168, 85, 247, 0.9) 100%);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 12px 32px rgba(124, 92, 255, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.35s var(--ease-spring);
            white-space: nowrap;
        }

        .hypnosis-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 16px 40px rgba(124, 92, 255, 0.68), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .hypnosis-btn:active {
            transform: scale(0.96);
        }

        .hypnosis-btn .icon-stop {
            display: none;
            width: 10px;
            height: 10px;
            border-radius: 2.5px;
            background: var(--accent-secondary);
            flex-shrink: 0;
        }

        .hypnosis-btn .icon-start {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* Active state: sleek low-distraction translucent glass pill */
        .app-shell.is-active .hypnosis-btn {
            height: 46px;
            min-width: 138px;
            padding: 0 22px;
            font-size: 14px;
            font-weight: 600;
            background: var(--surface-glass);
            border-color: var(--border-accent);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .app-shell.is-active .hypnosis-btn .icon-start {
            display: none;
        }

        .app-shell.is-active .hypnosis-btn .icon-stop {
            display: inline-block;
        }

        /* Immersive Hint */
        .immersive-hint {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            opacity: 0;
            transform: translateY(4px);
            pointer-events: none;
            transition: opacity 0.5s var(--ease-spring), transform 0.5s var(--ease-spring);
            white-space: nowrap;
        }

        .app-shell.is-active:not(.settings-open) .immersive-hint {
            opacity: 0.42;
            transform: translateY(0);
        }

        /* ===========================================
           IMMERSIVE MODE DIMMING (Active & Settings Closed)
           =========================================== */
        .app-shell.is-active:not(.settings-open) .top-pill {
            opacity: 0.34;
            transform: translateX(-50%) scale(0.96);
        }

        .app-shell.is-active:not(.settings-open) .top-pill:hover {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .app-shell.is-active:not(.settings-open) .glass-circle-btn {
            opacity: 0.28;
        }

        .app-shell.is-active:not(.settings-open) .glass-circle-btn:hover,
        .app-shell.is-active:not(.settings-open) .glass-circle-btn:focus-visible {
            opacity: 1;
        }

        .app-shell.is-active:not(.settings-open) .hypnosis-btn {
            opacity: 0.72;
        }

        .app-shell.is-active:not(.settings-open) .hypnosis-btn:hover {
            opacity: 1;
        }

        /* Desktop shift when right drawer is open */
        @media (min-width: 768px) {
            .app-shell.settings-open .top-pill,
            .app-shell.settings-open .bottom-controls {
                left: calc(50% - 196px);
            }
        }

        /* ===========================================
           GLASS SETTINGS DRAWER (Mobile Sheet / Desktop Side Card)
           =========================================== */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(5, 5, 10, 0.52);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s var(--ease-spring);
        }

        .drawer-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        @media (min-width: 768px) {
            /* On desktop keep backdrop subtle so user sees WebGL changes live */
            .drawer-overlay {
                background: rgba(5, 5, 10, 0.16);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
        }

        .settings-drawer {
            position: fixed;
            z-index: 60;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 84dvh;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius-drawer) var(--radius-drawer) 0 0;
            background: var(--surface-glass-elevated);
            border: 1px solid var(--border-glass);
            border-bottom: none;
            backdrop-filter: blur(36px) saturate(180%);
            -webkit-backdrop-filter: blur(36px) saturate(180%);
            box-shadow: 0 -14px 48px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transform: translateY(105%);
            pointer-events: none;
            transition: transform 0.42s var(--ease-spring);
            overflow: hidden;
        }

        .settings-drawer.active {
            transform: translateY(0);
            pointer-events: auto;
        }

        .drawer-handle-wrap {
            display: flex;
            justify-content: center;
            padding: 12px 0 4px;
            flex-shrink: 0;
        }

        .drawer-handle {
            width: 38px;
            height: 4px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.24);
        }

        @media (min-width: 768px) {
            .settings-drawer {
                left: auto;
                top: 24px;
                right: 24px;
                bottom: 24px;
                width: 368px;
                max-height: none;
                border-radius: 24px;
                border-bottom: 1px solid var(--border-glass);
                box-shadow: -14px 0 48px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.12);
                transform: translateX(calc(100% + 40px));
            }

            .settings-drawer.active {
                transform: translateX(0);
            }

            .drawer-handle-wrap {
                display: none;
            }
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px 12px;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .drawer-header {
                padding: 22px 24px 14px;
            }
        }

        .drawer-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text-primary);
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-glass);
            background: var(--surface-glass-subtle);
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.25s var(--ease-bounce), background 0.2s ease, border-color 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: var(--border-glass-strong);
            transform: rotate(90deg) scale(1.06);
        }

        .drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 24px max(24px, env(safe-area-inset-bottom, 24px));
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .drawer-body::-webkit-scrollbar {
            width: 4px;
        }
        .drawer-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .drawer-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border-radius: 99px;
        }

        /* ===========================================
           SLIDER ROWS (Custom Glassmorphic Sliders)
           =========================================== */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .control-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .control-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .value-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 9px;
            border-radius: var(--radius-pill);
            background: var(--surface-glass-subtle);
            border: 1px solid var(--border-glass);
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--accent-secondary);
            white-space: nowrap;
        }

        .value-badge.has-cjk {
            font-family: var(--font-sans);
        }

        input[type="range"] {
            --fill-pct: 50%;
            width: 100%;
            height: 5px;
            margin: 5px 0;
            border-radius: var(--radius-pill);
            background: linear-gradient(
                90deg,
                var(--accent-primary) 0%,
                var(--accent-secondary) var(--fill-pct),
                rgba(255, 255, 255, 0.14) var(--fill-pct),
                rgba(255, 255, 255, 0.14) 100%
            );
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fafaff;
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 12px rgba(124, 92, 255, 0.78);
            cursor: pointer;
            transition: transform 0.2s var(--ease-bounce), box-shadow 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.18);
            box-shadow: 0 0 16px rgba(192, 132, 252, 0.95);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fafaff;
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 12px rgba(124, 92, 255, 0.78);
            cursor: pointer;
        }

        .drawer-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 2px 0;
        }

        /* ===========================================
           SEGMENTED LANGUAGE CONTROL
           =========================================== */
        .lang-section-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .lang-segmented {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 4px;
            border-radius: var(--radius-control);
            background: var(--surface-glass-subtle);
            border: 1px solid var(--border-glass);
        }

        .lang-seg-btn {
            padding: 8px 6px;
            border-radius: 9px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s var(--ease-spring);
        }

        .lang-seg-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }

        .lang-seg-btn.active {
            background: var(--accent-primary);
            border-color: rgba(255, 255, 255, 0.25);
            color: var(--text-primary);
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(124, 92, 255, 0.45);
        }

        /* ===========================================

    <script>
        /* ================================================================
           LOCALIZATION SYSTEM
           ================================================================ */
        const translations = {
            ja: {
                appTitle: '催眠APP',
                statusIdle: '待機中',
                statusActive: '没入モード',

            },
            en: {

                statusIdle: 'Idle',
                statusActive: 'Immersive',

                immersiveHint: 'Immersive mode · Edge controls auto-dimmed',

                spiralArms: 'Spiral Arms',
                spacing: 'Spacing',
                spiralIntensity: 'Spiral Intensity',
                rippleIntensity: 'Ripple Intensity',
                rippleSpeed: 'Ripple Speed',
                speed: 'Rotation Speed',
                language: 'Language',
                quickLang: 'EN',
                dirExpand: 'Out',
                dirContract: 'In',
                dirStatic: 'Still',
                needStart: 'Please start hypnosis first',
                resetDone: 'All settings have been reset'
            },
            zh: {
                appTitle: '催眠APP',
                statusIdle: '待机中',
                statusActive: '沉浸模式',
                idleCue: '沉浸视觉引擎就绪',
                immersiveHint: '沉浸模式已开启 · 边缘控件已自动弱化',
                settings: '参数设置',
                startHypnosis: '开始催眠',
                endHypnosis: '结束催眠',
                climax: '强制高潮',
                resetAll: '重置所有设置',
                spiralArms: '螺旋臂',
                spacing: '间距',
                spiralIntensity: '螺旋强度',
                rippleIntensity: '光环强度',
                rippleSpeed: '光环速度',
                speed: '旋转速度',
                language: '界面语言',
                quickLang: '中',
                dirExpand: '扩散',
                dirContract: '收缩',
                dirStatic: '静止',
                needStart: '请先开始催眠',
                resetDone: '所有设置已重置'
            }
        };

        const langOrder = ['ja', 'en', 'zh'];
        let currentLanguage = 'ja';
        let toastTimer = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.classList.add('visible');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('visible');
            }, 2200);
        }

        function formatRippleSpeed(val) {
            const t = translations[currentLanguage];
            const dir = val > 0 ? t.dirExpand : val < 0 ? t.dirContract : t.dirStatic;
            return `${val.toFixed(1)} · ${dir}`;
        }

        function updateLanguage() {
            const t = translations[currentLanguage];
            document.title = t.appTitle;

            document.getElementById('appTitle').textContent = t.appTitle;
            document.getElementById('statusText').textContent = isHypnosisActive ? t.statusActive : t.statusIdle;
            document.getElementById('idleCueTitle').textContent = t.idleCue;
            document.getElementById('immersiveHint').textContent = t.immersiveHint;
            document.getElementById('settingsTitle').textContent = t.settings;
            document.getElementById('hypnosisBtnText').textContent = isHypnosisActive ? t.endHypnosis : t.startHypnosis;
            document.getElementById('climaxBtnText').textContent = t.climax;
            document.getElementById('resetBtnText').textContent = t.resetAll;
            document.getElementById('langQuickBtn').textContent = t.quickLang;

            document.getElementById('lblSpiralArms').textContent = t.spiralArms;
            document.getElementById('lblSpacing').textContent = t.spacing;
            document.getElementById('lblSpiralGlow').textContent = t.spiralIntensity;
            document.getElementById('lblRippleGlow').textContent = t.rippleIntensity;
            document.getElementById('lblRippleSpeed').textContent = t.rippleSpeed;
            document.getElementById('lblSpeed').textContent = t.speed;
            document.getElementById('lblLanguage').textContent = t.language;

            // Keep ripple direction localized
            const rippleValEl = document.getElementById('rippleSpeedValue');
            if (rippleValEl) rippleValEl.textContent = formatRippleSpeed(rippleSpeed);

            // Sync segmented language buttons
            document.querySelectorAll('.lang-seg-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLanguage);
            });

            try {
                localStorage.setItem('preferredLanguage', currentLanguage);
            } catch (e) {
                console.warn('Failed to save language preference:', e);
            }
        }

        window.switchLanguage = function(lang) {
            if (translations[lang]) {
                currentLanguage = lang;
                updateLanguage();
            }
        };

        window.cycleLanguage = function() {
            const nextIdx = (langOrder.indexOf(currentLanguage) + 1) % langOrder.length;
            switchLanguage(langOrder[nextIdx]);
        };

        function loadLanguagePreference() {
            try {
                const saved = localStorage.getItem('preferredLanguage');
                if (saved && translations[saved]) {
                    currentLanguage = saved;
                }
            } catch (e) {
                console.warn('Failed to load language preference:', e);
            }
            updateLanguage();
        }

        /* ================================================================
           WEBGL INITIALIZATION & SHADERS
           ================================================================ */
        const vertexShaderSource = `
            attribute vec4 aVertexPosition;
            void main() {
                gl_Position = aVertexPosition;
            }
        `;

        const fragmentShaderSource = `
            #ifdef GL_ES
            precision mediump float;
            #endif

            uniform vec2 u_resolution;
            uniform float u_time;
            uniform float u_spiralArms;
            uniform float u_spiralSpacing;
            uniform float u_spiralGlow;
            uniform float u_rippleGlow;
            uniform float u_rippleSpeed;
            uniform float u_rotationSpeed;
            uniform float u_activationProgress;
            uniform float u_deactivationProgress;
            uniform float u_climaxIntensity;

            void main() {
                vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / u_resolution.y;
                float d = length(uv);

                float goldenRatio = 1.618033988749895;
                float spiralAngle = u_time * u_rotationSpeed;
                vec3 spiralColor = vec3(2.0, 0.5, 3.0);
                vec3 rippleColor = vec3(1.5, 0.3, 2.5);
                vec3 climaxColor = vec3(1.0, 0.4, 0.8);

                float angle = atan(uv.y, uv.x);
                float goldenSpacing = pow(goldenRatio, d * u_spiralSpacing);
                float goldenSpiral = angle * u_spiralArms * 0.5 + goldenSpacing - spiralAngle;
                float spiralPattern = abs(sin(goldenSpiral));
                float spiralIntensity = (0.4 / spiralPattern) * u_spiralGlow;

                float ripple = abs(sin(d * 10.0 - u_time * u_rippleSpeed) / 10.0);
                float rippleIntensity = (0.02 / ripple) * u_rippleGlow;

                float expandRadius = u_activationProgress * 3.0;
                float expandWave = smoothstep(expandRadius + 0.3, expandRadius - 0.1, d);
                float expandGlow = exp(-pow(d - expandRadius, 2.0) * 8.0) * (1.0 - u_activationProgress * 0.5);

                float shrinkRadius = 3.0 - u_deactivationProgress * 3.0;
                float shrinkWave = smoothstep(shrinkRadius + 0.3, shrinkRadius - 0.1, d);
                float shrinkGlow = exp(-pow(d - shrinkRadius, 2.0) * 8.0) * u_deactivationProgress;

                float finalWave = mix(expandWave, shrinkWave, u_deactivationProgress);
                float finalGlow = mix(expandGlow, shrinkGlow, u_deactivationProgress);

                float climaxPulse = sin(u_time * 15.0) * 0.5 + 0.5;
                float climaxWave = smoothstep(0.5, 0.0, d) * u_climaxIntensity * 2.5;
                float climaxGlow = exp(-d * 1.5) * climaxPulse * u_climaxIntensity * 3.0;

                vec3 backgroundColor = vec3(0.02, 0.02, 0.04);
                vec3 spiralPart = spiralColor * spiralIntensity * finalWave;
                vec3 ripplePart = rippleColor * rippleIntensity * finalWave;
                vec3 expandPart = (spiralColor + rippleColor) * finalGlow;

                vec3 finalColor = mix(
                    backgroundColor + spiralPart + ripplePart + expandPart,
                    climaxColor * (climaxWave + climaxGlow),
                    u_climaxIntensity
                );

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const canvas = document.getElementById('glCanvas');
        function resizeCanvas() {
            const container = document.getElementById('container');
            if (!container) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(container.clientWidth * dpr);
            canvas.height = Math.floor(container.clientHeight * dpr);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const gl = canvas.getContext('webgl');
        if (!gl) {
            showToast('WebGL not supported in this browser');
            throw new Error('WebGL context not available');
        }

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createShaderProgram(gl, vertexSource, fragmentSource) {
            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Shader program linking error:', gl.getProgramInfoLog(program));
                return null;
            }
            return program;
        }

        const shaderProgram = createShaderProgram(gl, vertexShaderSource, fragmentShaderSource);
        const programInfo = {
            attribLocations: {
                vertexPosition: gl.getAttribLocation(shaderProgram, 'aVertexPosition'),
            },
            uniformLocations: {
                resolution: gl.getUniformLocation(shaderProgram, 'u_resolution'),
                time: gl.getUniformLocation(shaderProgram, 'u_time'),
                spiralArms: gl.getUniformLocation(shaderProgram, 'u_spiralArms'),
                spiralSpacing: gl.getUniformLocation(shaderProgram, 'u_spiralSpacing'),
                spiralGlow: gl.getUniformLocation(shaderProgram, 'u_spiralGlow'),
                rippleGlow: gl.getUniformLocation(shaderProgram, 'u_rippleGlow'),
                rippleSpeed: gl.getUniformLocation(shaderProgram, 'u_rippleSpeed'),
                rotationSpeed: gl.getUniformLocation(shaderProgram, 'u_rotationSpeed'),
                activationProgress: gl.getUniformLocation(shaderProgram, 'u_activationProgress'),
                deactivationProgress: gl.getUniformLocation(shaderProgram, 'u_deactivationProgress'),
                climaxIntensity: gl.getUniformLocation(shaderProgram, 'u_climaxIntensity'),
            },
        };

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, 1, 1, 1, -1, -1, 1, -1]), gl.STATIC_DRAW);

        /* ================================================================
           PARAMETERS & CONTROLS
           ================================================================ */
        let spiralArms = 6.0;
        let spiralSpacing = 4.0;
        let spiralGlow = 0.02;
        let rippleGlow = 1.0;
        let rippleSpeed = 4.0;
        let rotationSpeed = 2.0;

        const paramMap = {
            spiralArms: () => spiralArms,
            spiralSpacing: () => spiralSpacing,
            spiralGlow: () => spiralGlow,
            rippleGlow: () => rippleGlow,
            rippleSpeed: () => rippleSpeed,
            rotationSpeed: () => rotationSpeed
        };

        function updateSliderFill(slider) {
            const min = parseFloat(slider.min);
            const max = parseFloat(slider.max);
            const val = parseFloat(slider.value);
            const pct = ((val - min) / (max - min)) * 100;
            slider.style.setProperty('--fill-pct', `${Math.max(0, Math.min(100, pct))}%`);
        }

        function autoSaveSettings() {
            try {
                localStorage.setItem('hypnosisSettings', JSON.stringify({
                    spiralArms,
                    spiralSpacing,
                    spiralGlow,
                    rippleGlow,
                    rippleSpeed,
                    rotationSpeed
                }));
            } catch (e) {
                console.warn('Failed to auto-save settings:', e);
            }
        }

        function autoLoadSettings() {
            try {
                const preset = localStorage.getItem('hypnosisSettings');
                if (preset) {
                    const s = JSON.parse(preset);
                    if (s.spiralArms !== undefined) spiralArms = s.spiralArms;
                    if (s.spiralSpacing !== undefined) spiralSpacing = s.spiralSpacing;
                    if (s.spiralGlow !== undefined) spiralGlow = s.spiralGlow;
                    if (s.rippleGlow !== undefined) rippleGlow = s.rippleGlow;
                    if (s.rippleSpeed !== undefined) rippleSpeed = s.rippleSpeed;
                    if (s.rotationSpeed !== undefined) rotationSpeed = s.rotationSpeed;
                }
            } catch (e) {
                console.warn('Failed to auto-load settings:', e);
            }
        }

        autoLoadSettings();

        const controlsConfig = [
            { id: 'spiralArms', valueId: 'armsValue', variable: 'spiralArms' },
            { id: 'spiralSpacing', valueId: 'spacingValue', variable: 'spiralSpacing' },
            { id: 'spiralGlow', valueId: 'spiralGlowValue', variable: 'spiralGlow' },
            { id: 'rippleGlow', valueId: 'rippleGlowValue', variable: 'rippleGlow' },
            { id: 'rippleSpeed', valueId: 'rippleSpeedValue', variable: 'rippleSpeed' },
            { id: 'rotationSpeed', valueId: 'speedValue', variable: 'rotationSpeed' }
        ];

        function syncControlUI(control, value) {
            const slider = document.getElementById(control.id);
            const valueDisplay = document.getElementById(control.valueId);
            if (!slider || !valueDisplay) return;
            slider.value = value;
            updateSliderFill(slider);
            if (control.variable === 'spiralGlow') {
                valueDisplay.textContent = value.toFixed(2);
            } else if (control.variable === 'rippleSpeed') {
                valueDisplay.textContent = formatRippleSpeed(value);
            } else {
                valueDisplay.textContent = value.toFixed(1);
            }
        }

        function setupControls() {
            controlsConfig.forEach(control => {
                const slider = document.getElementById(control.id);
                if (!slider) return;
                syncControlUI(control, paramMap[control.variable]());
                slider.addEventListener('input', function() {
                    const value = parseFloat(this.value);
                    switch (control.variable) {
                        case 'spiralArms': spiralArms = value; break;
                        case 'spiralSpacing': spiralSpacing = value; break;
                        case 'spiralGlow': spiralGlow = value; break;
                        case 'rippleGlow': rippleGlow = value; break;
                        case 'rippleSpeed': rippleSpeed = value; break;
                        case 'rotationSpeed': rotationSpeed = value; break;
                    }
                    syncControlUI(control, value);
                    autoSaveSettings();
                });
            });
        }

        /* ================================================================
           APPLICATION STATE & INTERACTIONS
           ================================================================ */
        let isPaused = false;
        let isHypnosisActive = false;
        let hypnosisStartTime = null;
        let hypnosisEndTime = null;
        let climaxStartTime = null;

        const appShell = document.getElementById('appShell');

        window.toggleHypnosis = function() {
            isHypnosisActive = !isHypnosisActive;
            const t = translations[currentLanguage];

            appShell.classList.toggle('is-active', isHypnosisActive);
            document.getElementById('hypnosisBtnText').textContent = isHypnosisActive ? t.endHypnosis : t.startHypnosis;
            document.getElementById('statusText').textContent = isHypnosisActive ? t.statusActive : t.statusIdle;
            document.getElementById('climaxBtn').classList.toggle('active', isHypnosisActive);

            if (isHypnosisActive) {
                isPaused = false;
                hypnosisStartTime = null;
                hypnosisEndTime = null;
            } else {
                hypnosisEndTime = performance.now();
            }
        };

        window.triggerClimaxEffect = function() {
            if (!isHypnosisActive) {
                showToast(translations[currentLanguage].needStart);
                return;
            }
            climaxStartTime = performance.now();
            const climaxBtn = document.getElementById('climaxBtn');
            climaxBtn.classList.remove('pulsing');
            void climaxBtn.offsetWidth;
            climaxBtn.classList.add('pulsing');
        };

        window.toggleSettings = function() {
            const modal = document.getElementById('settingsModal');
            const overlay = document.getElementById('modalOverlay');
            const open = !modal.classList.contains('active');
            modal.classList.toggle('active', open);
            overlay.classList.toggle('active', open);
            appShell.classList.toggle('settings-open', open);
        };

        window.closeSettings = function() {
            document.getElementById('settingsModal').classList.remove('active');
            document.getElementById('modalOverlay').classList.remove('active');
            appShell.classList.remove('settings-open');
        };

        window.resetAllSettings = function() {
            const defaults = {
                spiralArms: 6.0,
                spiralSpacing: 4.0,
                spiralGlow: 0.02,
                rippleGlow: 1.0,
                rippleSpeed: 4.0,
                rotationSpeed: 2.0
            };

            spiralArms = defaults.spiralArms;
            spiralSpacing = defaults.spiralSpacing;
            spiralGlow = defaults.spiralGlow;
            rippleGlow = defaults.rippleGlow;
            rippleSpeed = defaults.rippleSpeed;
            rotationSpeed = defaults.rotationSpeed;

            controlsConfig.forEach(control => {
                syncControlUI(control, defaults[control.variable]);
            });

            try {
                localStorage.removeItem('hypnosisSettings');
            } catch (e) {
                console.warn('Failed to clear settings:', e);
            }

            showToast(translations[currentLanguage].resetDone);
        };

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeSettings();
            }
        });

        /* ================================================================
           RENDER LOOP
           ================================================================ */
        let lastTime = 0;
        let pausedTime = 0;

        function drawShader(currentSpiralGlow, currentRippleGlow, activationProgress, deactivationProgress, climaxIntensity) {
            gl.useProgram(shaderProgram);
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.vertexAttribPointer(programInfo.attribLocations.vertexPosition, 2, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(programInfo.attribLocations.vertexPosition);

            gl.uniform2f(programInfo.uniformLocations.resolution, canvas.width, canvas.height);
            gl.uniform1f(programInfo.uniformLocations.time, lastTime);
            gl.uniform1f(programInfo.uniformLocations.spiralArms, spiralArms);
            gl.uniform1f(programInfo.uniformLocations.spiralSpacing, spiralSpacing);
            gl.uniform1f(programInfo.uniformLocations.spiralGlow, currentSpiralGlow);
            gl.uniform1f(programInfo.uniformLocations.rippleGlow, currentRippleGlow);
            gl.uniform1f(programInfo.uniformLocations.rippleSpeed, rippleSpeed);
            gl.uniform1f(programInfo.uniformLocations.rotationSpeed, rotationSpeed);
            gl.uniform1f(programInfo.uniformLocations.activationProgress, activationProgress);
            gl.uniform1f(programInfo.uniformLocations.deactivationProgress, deactivationProgress);
            gl.uniform1f(programInfo.uniformLocations.climaxIntensity, climaxIntensity);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        function render(time) {
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0.02, 0.02, 0.04, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            let climaxIntensity = 0.0;
            if (climaxStartTime !== null) {
                const elapsed = performance.now() - climaxStartTime;
                if (elapsed < 600) {
                    climaxIntensity = Math.max(0.0, 1.0 - elapsed / 600);
                } else {
                    climaxStartTime = null;
                }
            }

            if (isHypnosisActive) {
                if (hypnosisStartTime === null) {
                    hypnosisStartTime = time;
                    hypnosisEndTime = null;
                }
                const activationProgress = Math.min((time - hypnosisStartTime) / 600, 1.0);
                if (!isPaused) {
                    lastTime = time * 0.001 - pausedTime;
                } else {
                    pausedTime = time * 0.001 - lastTime;
                }
                drawShader(
                    spiralGlow * activationProgress,
                    rippleGlow * activationProgress,
                    activationProgress,
                    0.0,
                    climaxIntensity
                );
            } else if (hypnosisEndTime !== null) {
                const deactivationProgress = Math.min((performance.now() - hypnosisEndTime) / 600, 1.0);
                if (deactivationProgress < 1.0) {
                    if (!isPaused) {
                        lastTime = time * 0.001 - pausedTime;
                    } else {
                        pausedTime = time * 0.001 - lastTime;
                    }
                    drawShader(
                        spiralGlow * (1.0 - deactivationProgress),
                        rippleGlow * (1.0 - deactivationProgress),
                        1.0,
                        deactivationProgress,
                        climaxIntensity
                    );
                } else {
                    hypnosisEndTime = null;
                }
            }

            requestAnimationFrame(render);
        }

        setupControls();
        loadLanguagePreference();
        requestAnimationFrame(render);
    </script>
</body>
</html>
